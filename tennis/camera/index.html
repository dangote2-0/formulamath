<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera AR · The Tennis Formula</title>
<script src="./aframe.min.js"></script>
<script src="./mindar-image-aframe.prod.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#0e0e12;}
#bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(8,10,18,.75);font-family:Arial,Helvetica,sans-serif;}
#bar .t{color:#7bffdf;font-weight:900;font-size:13px;letter-spacing:1px;}
#bar a{color:#B8860B;font-weight:900;font-size:12px;text-decoration:none;letter-spacing:1px;}
#hud{position:fixed;bottom:14px;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:10px;font-family:Arial,Helvetica,sans-serif;}
#hud .c{background:rgba(8,10,18,.8);border:1px solid #2a3a5a;border-radius:10px;padding:8px 16px;text-align:center;}
#hud .l{color:#8a9aaa;font-size:9px;letter-spacing:1px;}
#start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e0e12;font-family:Arial,Helvetica,sans-serif;text-align:center;padding:20px;}
#start .h{color:#7bffdf;font-size:22px;font-weight:900;letter-spacing:1px;margin-bottom:10px;}
#start .w{color:#8a9aaa;font-size:13px;line-height:1.5;max-width:420px;margin-bottom:22px;}
#start button{background:#7bffdf;color:#062a22;border:none;font-weight:900;font-size:17px;letter-spacing:2px;padding:16px 34px;border-radius:12px;}
#start .v{color:#3a4a5a;font-size:10px;margin-top:18px;letter-spacing:1px;}
#dbg{position:fixed;top:52px;left:8px;right:8px;z-index:30;color:#ff8080;font:12px Arial;text-shadow:0 1px 3px #000;white-space:pre-wrap;pointer-events:none;}
</style></head><body>
<div id="bar"><span class="t">THE COURT IN 3D &middot; CAMERA AR</span><a href="/tennis/cover/">&#8592; BACK</a></div>
<div id="hud"><div class="c"><div class="l" style="font-size:11px;color:#c8d8ea;">POINT YOUR CAMERA AT THE FRONT COVER OF THE BOOK</div></div></div>
<div id="dbg"></div>
<div id="start">
  <div class="h">THE COURT, OFF THE PAPER</div>
  <div class="w">Point your phone at the front cover of the book. The full 3D court rises off the cover &mdash; move around it, watch the ball fly.</div>
  <button id="go">TAP TO START</button>
  <div class="v">v8 &middot; 3D court</div>
</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: no; uiScanning: yes; uiLoading: no;" color-space="sRGB" renderer="alpha: true; colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <a-asset-item id="court-model" src="./tennis-court-cement.glb"></a-asset-item>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="anchor" mindar-image-target="targetIndex: 0">
    <!-- 3D court model: scale tuned so court fills the book cover width (~1.4 units) -->
    <a-gltf-model
      id="court3d"
      src="#court-model"
      position="0 0 0.05"
      rotation="-15 0 0"
      scale="0.06 0.06 0.06">
    </a-gltf-model>
    <!-- ball flies the length of the court in 3D space above the model -->
    <a-sphere id="flyball" color="#dfff4f" radius="0.028" position="-0.65 0.08 0.22"></a-sphere>
    <a-text value="PAGE 39, OFF THE PAPER" color="#7bffdf" position="0 0.65 0.22" scale="0.22 0.22 0.22" align="center"></a-text>
    <a-text value="formulamath.com" color="#B8860B" position="0 -0.65 0.22" scale="0.18 0.18 0.18" align="center"></a-text>
  </a-entity>
</a-scene>
<script>
var dbg=document.getElementById('dbg');
function say(m){dbg.textContent=(dbg.textContent+' | '+m).slice(-700);}
window.addEventListener('error',function(e){say('ERR: '+e.message);});
window.addEventListener('unhandledrejection',function(e){say('REJ: '+(e.reason&&e.reason.message||e.reason));});
if(typeof AFRAME==='undefined'){document.getElementById('start').querySelector('.w').textContent='The 3D engine did not load. Check your connection and reload.';}

// hide Melbourne/venue text nodes from the GLTF after it loads
document.getElementById('court3d').addEventListener('model-loaded',function(e){
  var model=e.detail.model;
  var hidden=[];
  model.traverse(function(node){
    var n=(node.name||'').toLowerCase();
    // hide any node that looks like venue signage or text labels
    if(n.indexOf('melb')>-1||n.indexOf('text')>-1||n.indexOf('sign')>-1||n.indexOf('logo')>-1||n.indexOf('advert')>-1||n.indexOf('sponsor')>-1||n.indexOf('banner')>-1){
      node.visible=false;
      hidden.push(node.name);
    }
  });
  if(hidden.length){say('hidden: '+hidden.join(', '));}
  say('model loaded');
});

// ball flies the length of the court above the 3D model
setInterval(function(){
  var b=document.getElementById('flyball');
  if(!b||!b.object3D)return;
  var t=(Date.now()%2800)/2800;
  var x=-0.65+1.3*t;
  var z=0.22+0.24*Math.sin(Math.PI*t);
  b.object3D.position.set(x,0.08,z);
},33);

document.getElementById('go').addEventListener('click',function(){
  var sc=document.querySelector('a-scene');
  var kick=function(){
    var sys=sc.systems&&sc.systems['mindar-image-system'];
    if(!sys){say('mindar system missing');return;}
    sc.addEventListener('arError',function(){say('AR ERROR: camera failed (permission denied or unsupported)');});
    document.getElementById('start').style.display='none';
    try{sys.start();}catch(e){say('START ERR: '+e.message);}
    var fix=function(){
      var v=document.querySelector('video');
      if(!v){return false;}
      v.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:0;display:block;';
      var c=document.querySelector('canvas.a-canvas');
      if(c){c.style.position='fixed';c.style.zIndex='2';c.style.top='0';c.style.left='0';}
      return true;
    };
    var tries=0,iv=setInterval(function(){tries++;if(fix()||tries>20){clearInterval(iv);}},500);
  };
  if(sc.hasLoaded){kick();}else{sc.addEventListener('loaded',kick);}
});
</script>
</body></html>
