<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Court in 3D — The Tennis Formula</title><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0e0e12;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px 40px;overflow-x:hidden;}
h1{font-size:24px;font-weight:900;color:#00e5ff;}
.sub{color:#8a9aaa;font-size:13px;margin:6px 0 18px;text-align:center;}
#stage{width:min(92vw,560px);height:min(72vw,430px);perspective:900px;touch-action:none;}
#court{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(55deg) rotateZ(0deg);transition:transform .05s linear;}
svg{width:100%;height:100%;}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;max-width:560px;}
.stat{background:#141e30;border:1px solid #2a3a5a;border-radius:8px;padding:8px 12px;text-align:center;}
.stat .v{color:#ffe000;font-weight:900;font-size:16px;}
.stat .l{color:#8a9aaa;font-size:10px;letter-spacing:1px;}
.hint{color:#5a6a7a;font-size:11px;margin-top:14px;}
a.back{color:#B8860B;font-size:12px;font-weight:900;text-decoration:none;margin-top:20px;letter-spacing:1px;}
</style></head><body>
<h1>THE COURT IN 3D</h1>
<div class="sub">Page 39, off the paper. Drag to spin. Every line is a measurement.</div>
<div id="stage"><div id="court">
<svg viewBox="0 0 260 130">
  <rect x="10" y="10" width="240" height="110" fill="#2a5298" stroke="#fff" stroke-width="1.6" rx="1"/>
  <rect x="10" y="24" width="240" height="82" fill="none" stroke="#fff" stroke-width="1"/>
  <line x1="130" y1="10" x2="130" y2="120" stroke="#fff" stroke-width="1.8"/>
  <line x1="66" y1="24" x2="66" y2="106" stroke="#fff" stroke-width="1"/>
  <line x1="194" y1="24" x2="194" y2="106" stroke="#fff" stroke-width="1"/>
  <line x1="66" y1="65" x2="194" y2="65" stroke="#fff" stroke-width="1"/>
  <text x="130" y="8" fill="#ffe000" font-size="7" text-anchor="middle" font-weight="bold">23.77 m</text>
  <text x="256" y="68" fill="#ffe000" font-size="7" text-anchor="middle" font-weight="bold" transform="rotate(90,256,68)">10.97 m</text>
  <text x="98" y="47" fill="#ffea00" font-size="6" text-anchor="middle">6.40 m</text>
  <text x="38" y="68" fill="#cfe8ff" font-size="6" text-anchor="middle">no-man's land</text>
  <circle id="ball" cx="20" cy="65" r="4" fill="#dfff4f"/>
</svg>
</div></div>
<div class="stats">
  <div class="stat"><div class="v">23.77 m</div><div class="l">FULL LENGTH</div></div>
  <div class="stat"><div class="v">10.97 m</div><div class="l">DOUBLES WIDTH</div></div>
  <div class="stat"><div class="v">8.23 m</div><div class="l">SINGLES WIDTH</div></div>
  <div class="stat"><div class="v">6.40 × 4.115 m</div><div class="l">SERVICE BOX</div></div>
  <div class="stat"><div class="v">260.76 m²</div><div class="l">DOUBLES AREA</div></div>
</div>
<div class="hint">The ball crossing the court is travelling 23.77 metres.</div>
<div style="background:#141e30;border:1.5px solid #B8860B;border-radius:10px;padding:14px;margin-top:14px;width:min(92vw,560px);">
  <div style="color:#ffe000;font-weight:900;font-size:14px;letter-spacing:1px;margin-bottom:8px;">CHECK YOUR PAGE 39 ANSWERS</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
    <label style="color:#8a9aaa;font-size:12px;">Singles area m&#178; <input id="c1" type="number" step="0.01" style="width:78px;background:#0e0e12;border:1px solid #2a3a5a;border-radius:6px;color:#fff;font-weight:900;padding:6px;text-align:center;"></label>
    <label style="color:#8a9aaa;font-size:12px;">Doubles area m&#178; <input id="c2" type="number" step="0.01" style="width:78px;background:#0e0e12;border:1px solid #2a3a5a;border-radius:6px;color:#fff;font-weight:900;padding:6px;text-align:center;"></label>
    <label style="color:#8a9aaa;font-size:12px;">Service box m&#178; <input id="c3" type="number" step="0.01" style="width:78px;background:#0e0e12;border:1px solid #2a3a5a;border-radius:6px;color:#fff;font-weight:900;padding:6px;text-align:center;"></label>
    <button id="check" style="background:#B8860B;color:#fff;border:none;font-weight:900;font-size:13px;padding:9px 16px;border-radius:8px;">CHECK</button>
  </div>
  <div id="ck" style="color:#c8d8ea;font-size:12.5px;margin-top:8px;min-height:16px;"></div>
</div>
<script>
document.getElementById('check').addEventListener('click',function(){
 var T=[[+document.getElementById('c1').value,195.63],[+document.getElementById('c2').value,260.76],[+document.getElementById('c3').value,26.34]];
 var names=['Singles','Doubles','Service box'];var out=[];
 for(var i=0;i<3;i++){var v=T[i][0],t=T[i][1];
  if(!v){out.push(names[i]+': type your answer');}
  else if(Math.abs(v-t)<=0.5){out.push('&#9989; '+names[i]+' correct');}
  else{out.push('&#10060; '+names[i]+': not quite, back to page 39');}}
 document.getElementById('ck').innerHTML=out.join(' &nbsp;&middot;&nbsp; ');});
</script>
<a class="back" href="/tennis/">&#8592; THE AR COURT</a>
<script>
var court=document.getElementById('court'),stage=document.getElementById('stage');
var rx=55,rz=0,dragging=false,lx=0,ly=0;
function apply(){court.style.transform='rotateX('+rx+'deg) rotateZ('+rz+'deg)';}
function down(x,y){dragging=true;lx=x;ly=y;}
function move(x,y){if(!dragging)return;rz+=(x-lx)*0.4;rx-=(y-ly)*0.3;rx=Math.max(15,Math.min(80,rx));lx=x;ly=y;apply();}
stage.addEventListener('mousedown',function(e){down(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){move(e.clientX,e.clientY);});
window.addEventListener('mouseup',function(){dragging=false;});
stage.addEventListener('touchstart',function(e){var t=e.touches[0];down(t.clientX,t.clientY);e.preventDefault();},{passive:false});
stage.addEventListener('touchmove',function(e){var t=e.touches[0];move(t.clientX,t.clientY);e.preventDefault();},{passive:false});
window.addEventListener('touchend',function(){dragging=false;});
var ball=document.getElementById('ball'),t=0;
setInterval(function(){t+=0.016;var p=(t%3)/3;ball.setAttribute('cx',20+220*p);ball.setAttribute('cy',65-40*Math.sin(Math.PI*p));},16);
</script>
</body></html>
